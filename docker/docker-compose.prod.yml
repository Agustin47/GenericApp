# =============================================================================
# Docker Compose for Production
# Uses MongoDB Atlas (external) - No local MongoDB
# =============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Senado API - Production
  # ==========================================================================
  api:
    image: ${DOCKER_REGISTRY:-senado}/senado-api:${TAG:-latest}
    container_name: senado-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__DatabaseName=senado
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ==========================================================================
  # Nginx Reverse Proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: senado-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot-data:/var/www/certbot:ro
    depends_on:
      - api
    restart: always

  # ==========================================================================
  # Certbot for SSL (Let's Encrypt)
  # ==========================================================================
  certbot:
    image: certbot/certbot
    container_name: senado-certbot
    volumes:
      - certbot-data:/var/www/certbot
      - ./ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl

volumes:
  certbot-data:
